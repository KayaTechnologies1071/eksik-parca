    name: eksik-parca
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://zioqzlzhvdvxddwsnhem.supabase.co
      - key: SUPABASE_EDGE_API_URL
        value: https://zioqzlzhvdvxddwsnhem.supabase.co/functions/v1/eksik-parca-api
